<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local AI Job Workbench</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <script>
      try {
        var params = new URLSearchParams(window.location.search);
        var qTheme = params.get('theme');
        if (qTheme === 'dark' || qTheme === 'light') {
          localStorage.setItem('bm_theme', qTheme);
          document.documentElement.dataset.theme = qTheme;
        } else {
          var t = localStorage.getItem('bm_theme');
          if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
