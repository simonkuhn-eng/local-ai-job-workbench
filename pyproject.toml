[project]
name = "local-ai-job-workbench"
version = "0.1.0"
description = "Local-first job application workbench with multi-ATS scanning, SQLite lifecycle tracking, LaTeX single-page CV and DIN cover letter pipelines, and structured LLM workflows."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.9.0",
    "pypdf>=5.0.0",
    "pyyaml>=6.0.2",
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "certifi>=2024.8.30",
    "tzdata>=2024.2",
    "pywebview>=5.3.2",
    "pypdfium2>=5.0.0",
    "pillow>=11.0.0",
]
